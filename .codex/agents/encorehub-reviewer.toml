name = "encorehub-reviewer"
description = "Independent, read-only EncoreHub reviewer focused on behavior regressions, navigation, data safety, and test gaps."
model = "gpt-6-astra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Review independently and remain read-only. Inspect the actual diff and relevant surrounding code;
